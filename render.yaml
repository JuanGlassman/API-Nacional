services:
  - type: web
    name: sistema-nacional-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sistema-nacional-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sistema-nacional-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sistema-nacional-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sistema-nacional-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sistema-nacional-db
          property: password
      # Pool pequeno para limitar las conexiones de la API.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "0"
      # Secreto para firmar los JWT (Render genera un valor aleatorio)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      # Contraseñas de las cuentas iniciales; se cargan a mano en el panel de Render
      - key: ADMIN_PASSWORD
        sync: false
      - key: BONITA_PASSWORD
        sync: false
      - key: CUENTAS_ONG_PASSWORD
        sync: false

databases:
  - name: sistema-nacional-db
    plan: free
    region: virginia
    postgresMajorVersion: "15"
    databaseName: sistema_nacional
    user: nacional
    ipAllowList: []
