services:
  - type: web
    name: sistema-nacional-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sistema-nacional-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sistema-nacional-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sistema-nacional-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sistema-nacional-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sistema-nacional-db
          property: password
      # Pool pequeno para limitar las conexiones de la API.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "0"
      # Reservado para la implementación de Javi; aún no lo consume la API.
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: sistema-nacional-db
    plan: free
    region: virginia
    postgresMajorVersion: "15"
    databaseName: sistema_nacional
    user: nacional
    ipAllowList: []
