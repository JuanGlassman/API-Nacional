# API gratis en Render; PostgreSQL externo en Neon Free.
# Ver docs/despliegue-facu.md para conectar un servicio ya desplegado.
services:
  - type: web
    name: sistema-nacional-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      # URL JDBC con SSL, sin usuario ni contraseña en la URL.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Liberar conexiones ociosas para permitir la suspensión de Neon.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "60000"
      - key: SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME
        value: "0"
      # Reservado para la implementación de Javi; aún no lo consume la API.
      - key: JWT_SECRET
        generateValue: true
