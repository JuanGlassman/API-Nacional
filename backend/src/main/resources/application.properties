spring.application.name=sistema-nacional
spring.config.import=optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT (el secreto debe tener al menos 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Cuentas que se crean al arrancar si no existen (vacío = no se crea)
cuentas.admin.password=${ADMIN_PASSWORD:}
cuentas.bonita.password=${BONITA_PASSWORD:}
# Contraseña común de las cuentas de las ONGs del seed (vacío = no se crean)
cuentas.ong.password=${CUENTAS_ONG_PASSWORD:}

# Horas que dura la reserva temporal (validación) si no se convierte en definitiva
reservas.bloqueo-horas=${RESERVAS_BLOQUEO_HORAS:24}


# SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha