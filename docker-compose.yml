services:

  postgres:
    image: postgres:15-alpine
    container_name: sistema_nacional_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_nacional_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - sistema-nacional-network

  backend:
    build: ./backend
    container_name: sistema_nacional_backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BONITA_PASSWORD: ${BONITA_PASSWORD}
      CUENTAS_ONG_PASSWORD: ${CUENTAS_ONG_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sistema-nacional-network

volumes:
  postgres_nacional_data:

networks:
  sistema-nacional-network:
    driver: bridge