services:

  postgres:
    image: postgres:15-alpine
    container_name: sistema_nacional_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_nacional_data:/var/lib/postgresql/data
    networks:
      - sistema-nacional-network

  backend:
    build: ./backend
    container_name: sistema_nacional_backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - sistema-nacional-network

volumes:
  postgres_nacional_data:

networks:
  sistema-nacional-network:
    driver: bridge